# YAML sample
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  labels: { app: sample, tier: "backend" }
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{ containerPort: 80 }]
          env:
            - name: DEBUG
              value: "true"
